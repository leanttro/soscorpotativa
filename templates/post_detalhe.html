<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ post.titulo }} | {{ loja.nome }}</title>
<meta name="description" content="{{ post.resumo or '' }}">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root { --navy:#1B3A6B; --gold:#B8923A; --gold2:#d4a84b; --cream:#F8F6F1; --text:#1C2B3A; --muted:#6B7A8D; --border:#E2DDD6; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;color:var(--text);background:#fff}
  h1,h2{font-family:'Cormorant Garamond',serif}
  a{color:inherit;text-decoration:none}
  .container{max-width:760px;margin:0 auto;padding:0 1.5rem}
  header{background:linear-gradient(135deg,var(--navy) 0%,#24508A 100%);padding:5rem 0 3.5rem}
  header .back{display:inline-flex;align-items:center;gap:.4rem;color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:1.5rem}
  header .back:hover{color:#fff}
  header .meta{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem}
  header .cat{background:var(--gold);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.25rem .75rem;border-radius:4px}
  header .date{color:rgba(255,255,255,.55);font-size:.85rem}
  header h1{color:#fff;font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.2}
  main{padding:3.5rem 0 6rem}
  .img-cover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:2.5rem}
  .conteudo{font-size:1.02rem;line-height:1.95;color:var(--text);white-space:pre-wrap}
  .cta-box{margin-top:3.5rem;padding:2rem;background:var(--cream);border:1px solid var(--border);border-radius:12px;text-align:center}
  .cta-box a{display:inline-flex;margin-top:1rem;background:var(--gold);color:#fff;font-weight:700;padding:.85rem 2rem;border-radius:6px}
  .cta-box a:hover{background:var(--gold2)}
</style>
</head>
<body>
<header>
  <div class="container">
    <a href="/#blog" class="back"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Voltar ao blog</a>
    <div class="meta">
      <span class="cat">{{ post.categoria or 'Artigo' }}</span>
      {% if post.data %}<span class="date">{{ post.data }}</span>{% endif %}
    </div>
    <h1>{{ post.titulo }}</h1>
  </div>
</header>
<main>
  <div class="container">
    {% if post.capa %}
      <img class="img-cover" src="{{ post.capa }}" alt="{{ post.titulo }}">
    {% endif %}
    <div class="conteudo">{{ post.conteudo }}</div>
    <div class="cta-box">
      <strong>Quer levar isso pra sua empresa?</strong>
      <br>
      <a href="/#contato">Falar com um especialista</a>
    </div>
  </div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
