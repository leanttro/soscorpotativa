<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ═══════════════════════════════════════════
     SEO PRIMÁRIO
═══════════════════════════════════════════ -->
<title>{{ produto.nome }} | {{ loja.nome }}</title>
<meta name="description" content="{{ produto.descricao or (produto.descricao_completa or '')[:160] }}">
<meta name="keywords" content="{{ produto.nome }}, {{ loja.nome }}, saúde mental corporativa, RH estratégico, NR-01">
<meta name="author" content="{{ loja.nome }}">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<link rel="canonical" href="https://www.soscorporativa.com.br/{{ loja.slug_url }}/produto/{{ produto.slug }}">

<!-- ═══════════════════════════════════════════
     OPEN GRAPH (Facebook, WhatsApp, LinkedIn)
═══════════════════════════════════════════ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ loja.nome }}">
<meta property="og:title" content="{{ produto.nome }} | {{ loja.nome }}">
<meta property="og:description" content="{{ produto.descricao or (produto.descricao_completa or '')[:160] }}">
<meta property="og:url" content="https://www.soscorporativa.com.br/{{ loja.slug_url }}/produto/{{ produto.slug }}">
{% if produto.imagem %}
<meta property="og:image" content="{{ produto.imagem }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ produto.nome }}">
{% endif %}
<meta property="og:locale" content="pt_BR">

<!-- ═══════════════════════════════════════════
     TWITTER CARD
═══════════════════════════════════════════ -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ produto.nome }} | {{ loja.nome }}">
<meta name="twitter:description" content="{{ produto.descricao or (produto.descricao_completa or '')[:160] }}">
{% if produto.imagem %}<meta name="twitter:image" content="{{ produto.imagem }}">{% endif %}

<!-- ═══════════════════════════════════════════
     SCHEMA.ORG JSON-LD — Rich Results Google
═══════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ produto.nome | tojson }},
  "description": {{ (produto.descricao or '') | tojson }},
  {% if produto.imagem %}"image": {{ produto.imagem | tojson }},{% endif %}
  "provider": {
    "@type": "Organization",
    "name": {{ loja.nome | tojson }},
    "logo": "https://res.cloudinary.com/evwhdqmt/image/upload/v1786723590/soslogo_bx4m1y.png"
  },
  "areaServed": "BR",
  "url": "https://www.soscorporativa.com.br/{{ loja.slug_url }}/produto/{{ produto.slug }}"
}
</script>

<!-- ═══════════════════════════════════════════
     FAVICON
═══════════════════════════════════════════ -->
<link rel="icon" type="image/png" href="https://res.cloudinary.com/evwhdqmt/image/upload/v1786723590/soslogo_bx4m1y.png">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/evwhdqmt/image/upload/v1786723590/soslogo_bx4m1y.png">
<meta name="theme-color" content="#1B3A6B">

<!-- ═══════════════════════════════════════════
     GOOGLE ANALYTICS 4
═══════════════════════════════════════════ -->
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1D5C4TX5NR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1D5C4TX5NR');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root { --navy:#1B3A6B; --navy2:#142d54; --gold:#B8923A; --gold2:#d4a84b; --cream:#F8F6F1; --text:#1C2B3A; --muted:#6B7A8D; --border:#E2DDD6; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;color:var(--text);background:#fff}
  h1,h2{font-family:'Cormorant Garamond',serif}
  a{color:inherit;text-decoration:none}
  .container{max-width:860px;margin:0 auto;padding:0 1.5rem}
  header{background:linear-gradient(135deg,var(--navy) 0%,#24508A 100%);padding:5rem 0 3.5rem}
  header .back{display:inline-flex;align-items:center;gap:.4rem;color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:1.5rem}
  header .back:hover{color:#fff}
  header h1{color:#fff;font-size:clamp(2rem,4vw,2.8rem);line-height:1.15}
  main{padding:3.5rem 0 6rem}
  .img-cover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:2.5rem}
  .conteudo{font-size:1.02rem;line-height:1.9;color:var(--text);white-space:pre-wrap}
  .cta-box{margin-top:3rem;padding:2rem;background:var(--cream);border:1px solid var(--border);border-radius:12px;text-align:center}
  .cta-box a{display:inline-flex;margin-top:1rem;background:var(--gold);color:#fff;font-weight:700;padding:.85rem 2rem;border-radius:6px}
  .cta-box a:hover{background:var(--gold2)}
</style>
</head>
<body>
<header>
  <div class="container">
    <a href="/#servicos-rh" class="back"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Voltar aos serviços</a>
    <h1>{{ produto.nome }}</h1>
  </div>
</header>
<main>
  <div class="container">
    {% if produto.imagem %}
      <img class="img-cover" src="{{ produto.imagem }}" alt="{{ produto.nome }}">
    {% endif %}
    <div class="conteudo" id="conteudoProduto">{{ (produto.descricao_completa or produto.descricao or '') }}</div>
    <div class="cta-box">
      <strong>Quer saber mais sobre este serviço?</strong>
      <br>
      <a href="/#contato">Solicitar orçamento</a>
    </div>
  </div>
</main>
<script>
  // remove indentação forçada (tabs/espaços) que vêm do painel, mantendo as quebras de linha
  (function() {
    const el = document.getElementById('conteudoProduto');
    if (!el) return;
    el.textContent = el.textContent
      .split('\n')
      .map(linha => linha.replace(/^[\t ]+/, '').replace(/[\t ]+$/, ''))
      .join('\n')
      .trim();
  })();
  lucide.createIcons();
</script>
</body>
</html>
